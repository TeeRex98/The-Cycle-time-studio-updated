<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cycle Time Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316211f'/%3E%3Ccircle cx='16' cy='17' r='8' fill='none' stroke='%238fe9c6' stroke-width='2.4'/%3E%3Cpath d='M16 12v5l3 3' stroke='%238fe9c6' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#221f1a; --paper:#f4f2ec; --panel:#ffffff; --line:#e2ded3;
    --teal:#0e6e66; --teal-dark:#0a4f49; --amber:#d98a1f; --red:#b3452c;
    --lcd-bg:#16211f; --lcd-fg:#8fe9c6;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font-family: inherit; }
  .mono{ font-family: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace; }
  #app{ max-width: 1080px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }

  header{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{ width:34px; height:34px; border-radius:8px; background:var(--lcd-bg);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand-title{ font-weight:600; font-size:15px; line-height:1; }
  .brand-sub{ font-size:11px; opacity:.6; margin-top:4px; }
  nav{ display:flex; gap:2px; overflow-x:auto; }
  .tab-btn{ display:flex; align-items:center; gap:6px; padding:9px 12px; font-size:13px; font-weight:500;
    border:none; background:transparent; border-bottom:2px solid transparent; color:#6b665b; cursor:pointer;
    white-space:nowrap; border-radius:6px 6px 0 0; }
  .tab-btn[data-active="1"]{ border-bottom-color:var(--teal); color:var(--teal-dark); }

  main{ flex:1; padding:14px 16px 40px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn{ display:inline-flex; align-items:center; gap:6px; border:none; border-radius:8px; cursor:pointer;
    font-size:13.5px; font-weight:600; padding:11px 16px; min-height:42px; }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-outline{ background:#fff; border:1px solid var(--line); color:var(--ink); font-weight:500; }
  .btn-danger{ background:transparent; color:var(--red); font-weight:500; padding:11px 12px; }
  .btn-link{ background:none; border:none; color:var(--teal-dark); text-decoration:underline; font-size:12px; font-weight:500; cursor:pointer; padding:4px; }
  input[type=text], input[type=number], input[type=date], select, input[type=file]{
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:13.5px; background:#fff; color:var(--ink); }
  input[type=number]{ width:80px; }
  label.field-label{ font-size:12px; font-weight:500; opacity:.7; }

  .lcd{ background:var(--lcd-bg); border-radius:14px; padding:26px 18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; }
  .lcd-label{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--lcd-fg); opacity:.75; text-align:center; }
  .lcd-clock{ font-size:44px; font-weight:600; letter-spacing:.02em; color:var(--lcd-fg); }
  .lcd-sub{ font-size:11px; color:var(--lcd-fg); opacity:.7; }

  .step-chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:7px; font-size:11.5px;
    font-weight:500; white-space:nowrap; border:1px solid var(--line); background:var(--paper); color:#6b665b; }
  .step-badge{ font-family: ui-monospace, monospace; padding:1px 5px; border-radius:5px; background:rgba(0,0,0,.06); color:#8a8578; }
  .step-rail{ display:flex; align-items:center; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .step-sep{ width:10px; height:1px; background:var(--line); flex-shrink:0; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; text-transform:uppercase; font-size:10.5px; letter-spacing:.03em; opacity:.55; padding:6px 10px 6px 0; }
  td{ padding:7px 10px 7px 0; border-top:1px solid var(--line); }
  .tbl-wrap{ overflow-x:auto; }
  .num{ text-align:right; font-family: ui-monospace, monospace; }

  .toast{ position:fixed; bottom:16px; right:16px; left:16px; max-width:340px; margin-left:auto; padding:11px 14px;
    border-radius:10px; font-size:13px; font-weight:500; color:#fff; z-index:50; box-shadow:0 6px 18px rgba(0,0,0,.18); }

  .grid-2{ display:grid; grid-template-columns:1fr; gap:14px; }
  .grid-timer-3{ display:grid; grid-template-columns:1fr; gap:14px; }
  .grid-models{ display:grid; grid-template-columns:1fr; gap:14px; }
  .grid-models-3{ display:grid; grid-template-columns:1fr; gap:14px; }
  .model-list-btn{ display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; gap:6px;
    padding:9px 10px; border-radius:8px; border:none; background:transparent; font-size:13px; font-weight:500; cursor:pointer; color:var(--ink); }
  .model-list-btn[data-active="1"]{ background:#e7f2ef; color:var(--teal-dark); }
  .model-list-btn:disabled{ opacity:.5; cursor:default; }
  .step-edit-row{ display:grid; grid-template-columns:26px 1fr 1fr 78px 40px; gap:6px; align-items:center; margin-bottom:6px; }
  .step-edit-row input{ width:100%; padding:7px 8px; font-size:13px; }
  .chev-col{ display:flex; flex-direction:column; align-items:center; gap:0; opacity:.55; }
  .chev-col button{ background:none; border:none; cursor:pointer; color:inherit; padding:1px; }

  .filters{ padding:12px; }
  footer.note{ font-size:11.5px; opacity:.55; padding:10px 2px 0; }

  @media(min-width:860px){
    .grid-2{ grid-template-columns: 1fr 320px; }
    .grid-timer-3{ grid-template-columns: 260px 1fr 300px; }
    .grid-models{ grid-template-columns: 220px 1fr; }
    .grid-models-3{ grid-template-columns: 190px 220px 1fr; }
  }
  @media(max-width:520px){
    .lcd-clock{ font-size:36px; }
    .brand-sub{ display:none; }
    th, td{ padding-right:6px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>

      if(m){for(var q=0;q<m[1].length;q++) col=col*26+(m[1].charCodeAt(q)-64); col--;}

function parseImportFile(text, name){

function splitCSVLine(line){
  var res=[], cur="", inQ=false;
  for (var i=0;i<line.length;i++){
    var c = line[i];
    if (inQ){
      if (c==='"'){ if (line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else {
      if (c==='"') inQ=true;
      else if (c===',') { res.push(cur); cur=""; }
      else cur+=c;
    }
  }
  res.push(cur);
  return res;
}
function parseCSV(text){
  var lines = text.replace(/\r/g,"").split("\n").filter(function(l){return l.length>0;});
  if (!lines.length) return [];
  var headers = splitCSVLine(lines[0]);
  var rows = [];
  for (var i=1;i<lines.length;i++){
    var cols = splitCSVLine(lines[i]);
    var obj = {};
    headers.forEach(function(h,idx){ obj[h] = cols[idx]!==undefined ? cols[idx] : ""; });
    rows.push(obj);
  }
  return rows;
}
function parseExcelHtml(text){
  var doc = new DOMParser().parseFromString(text, "text/html");
  var table = doc.querySelector("table");
  if (!table) return [];
  var trs = table.querySelectorAll("tr");
  if (!trs.length) return [];
  var headers = Array.prototype.map.call(trs[0].children, function(c){ return c.textContent.trim(); });
  var rows = [];
  for (var i=1;i<trs.length;i++){
    var cells = trs[i].children, obj = {};
    headers.forEach(function(h,idx){ obj[h] = cells[idx] ? cells[idx].textContent.trim() : ""; });
    rows.push(obj);
  }
  return rows;
}

function getStepReps(step, model){
  if (step && step.reps !== undefined && step.reps !== null) return step.reps;
  return (model && model.targetSamples) || 5;
}

function getStepDetails(stepId){
  var step = getTimerSteps().find(function(s){ return s.id === stepId; });
  if (!step) return { hc:1, worker:"", session:"", comment:"" };
  return {
    hc: Math.max(1, parseInt(step.hc,10) || 1),
    worker: step.worker || "",
    session: step.session || "",
    comment: step.comment || ""
  };
}

function netStepMs(t){
  if (!t) return 0;
  // Net time = active running time only; paused time is excluded.
  return t.paused ? t.pausedAccum : t.pausedAccum + (Date.now() - t.runningSince);
}

function seedModels(){
  return [{
    id: uid(), name: "Model A", code: "MDL-A", targetSamples: 5,

function init(){
  var m = lsGet(LS_MODELS);
  var r = lsGet(LS_RECORDS);
  var studies = lsGet(LS_STUDIES);
  var settings = lsGet(LS_SETTINGS) || {};
  var active = lsGet(LS_ACTIVE);
  state.models = (m && m.length) ? m : seedModels();
  state.records = r || [];
  state.studies = studies || [];
  state.operatorName = settings.operatorName || "";
  if (!m || !m.length) lsSet(LS_MODELS, state.models);
  state.timerModelId = state.models[0] ? state.models[0].id : null;
  state.modelsSelId = state.models[0] ? state.models[0].id : null;
  state.modelsSelStepId = (state.models[0] && state.models[0].steps[0]) ? state.models[0].steps[0].id : null;
  if (active && active.timers) {
    state.timerModelId = active.timerModelId || state.timerModelId;
    state.activeStudyId = active.activeStudyId || null;
    state.timers = active.timers || {};
    if (active.sessionStart && Date.now() - active.sessionStart < 16*3600*1000) state.sessionStart = active.sessionStart;
  }
  if (!state.models.some(function(m){ return m.id === state.timerModelId; })){
    state.timerModelId = state.models[0] ? state.models[0].id : null; state.timers = {};
  }
  if (state.activeStudyId && !state.studies.some(function(st){ return st.id === state.activeStudyId && st.status === "in-progress"; })) state.activeStudyId = null;
  render();
}

function persistModels(next){
  state.models = next;
  if (!lsSet(LS_MODELS, next)) showToast("Couldn't save — storage may be full or blocked", "err");
}
function persistRecords(next){
  state.records = next;
  if (!lsSet(LS_RECORDS, next)) showToast("Couldn't save the recording", "err");
}
function persistStudies(next){
  state.studies = next;
  if (!lsSet(LS_STUDIES, next)) showToast("Couldn't save the study", "err");
}
function persistActiveState(){
  lsSet(LS_ACTIVE, { timerModelId: state.timerModelId, activeStudyId: state.activeStudyId, timers: state.timers, sessionStart: state.sessionStart });
}
function persistSettings(){ lsSet(LS_SETTINGS, { operatorName: state.operatorName || "" }); }
function getActiveStudy(){
  return state.studies.find(function(st){ return st.id === state.activeStudyId && st.status === "in-progress"; }) || null;
}
function createStudyForModel(modelId){
  var model = state.models.find(function(m){ return m.id === modelId; });
  if (!model) return null;
  var now = new Date().toISOString();
  var count = state.studies.filter(function(st){ return st.modelId === modelId; }).length + 1;
  var study = { id: uid(), modelId:modelId, modelName:model.name, name:model.name+" — Study "+pad(count,3), status:"in-progress", startedAt:now, lastActivityAt:now, completedAt:null, operatorName:state.operatorName||"" };
  persistStudies(state.studies.concat([study]));
  state.activeStudyId = study.id;
  persistActiveState();
  return study;
}
function ensureActiveStudy(modelId){
  var active = getActiveStudy();
  if (active && active.modelId === modelId) return active;
  var latest = state.studies.filter(function(st){ return st.modelId === modelId && st.status === "in-progress"; }).sort(function(a,b){ return new Date(b.lastActivityAt||b.startedAt)-new Date(a.lastActivityAt||a.startedAt); })[0];
  if (latest){ state.activeStudyId = latest.id; persistActiveState(); return latest; }
  return createStudyForModel(modelId);
}
function touchStudy(){
  if (!state.activeStudyId) return;
  var now = new Date().toISOString();
  persistStudies(state.studies.map(function(st){ return st.id === state.activeStudyId ? Object.assign({},st,{lastActivityAt:now,operatorName:state.operatorName||st.operatorName||""}) : st; }));
}
window.startNewStudy = function(){
  var model=getTimerModel(); if(!model) return;
  if(anyTimerActive()){showToast("Stop or discard running timers before starting a new study","err");return;}
  createStudyForModel(model.id); state.sessionStart=Date.now(); state.lastReading=null; renderTab();
};
window.continueStudy = function(id){
  if(anyTimerActive()){showToast("Stop or discard running timers before changing studies","err");return;}
  var study=state.studies.find(function(st){return st.id===id&&st.status==="in-progress";}); if(!study)return;
  state.activeStudyId=id; state.timerModelId=study.modelId; persistActiveState(); renderTab();
};
window.finishStudy = function(){
  if(!state.activeStudyId)return;
  if(anyTimerActive()){showToast("Stop or discard running timers before finishing the study","err");return;}
  var id=state.activeStudyId, now=new Date().toISOString();
  persistStudies(state.studies.map(function(st){return st.id===id?Object.assign({},st,{status:"completed",completedAt:now,lastActivityAt:now}):st;}));

function showToast(text, kind){
  var old = document.getElementById("cts-toast");
  if (old) old.remove();
  var el = document.createElement("div");
  el.id = "cts-toast";
  el.className = "toast";
  el.style.background = kind === "err" ? "var(--red)" : "var(--teal-dark)";
  el.textContent = text;
  document.body.appendChild(el);
  window.clearTimeout(showToast._t);
  showToast._t = window.setTimeout(function(){ el.remove(); }, 3200);

function getTimerModel(){ return state.models.find(function(m){ return m.id === state.timerModelId; }) || null; }
function getTimerSteps(){ var m = getTimerModel(); return m ? m.steps : []; }

function timerEntry(stepId){ return state.timers[stepId] || null; }
function stepMsFor(stepId){ return netStepMs(state.timers[stepId]); }
function anyTimerRunning(){
  return Object.keys(state.timers).some(function(k){ return !state.timers[k].paused; });
}
function anyTimerActive(){ return Object.keys(state.timers).length > 0; }
function pruneTimers(){
  var ids = {};
  getTimerSteps().forEach(function(s){ ids[s.id] = true; });
  var changed = false;
  Object.keys(state.timers).forEach(function(k){ if (!ids[k]){ delete state.timers[k]; changed = true; } });
  if (changed) persistActiveState();
  return changed;
}

window.toggleStudyMode = function(){
  if (anyTimerActive()){ showToast("Stop or discard the running timer before changing Study mode", "err"); return; }
  state.studyMode = !state.studyMode;
  if (!state.studyMode){
    state.activeStudyId = null;
    persistActiveState();
  } else {
    var model = getTimerModel();
    var latest = model ? state.studies.filter(function(st){ return st.modelId===model.id && st.status==="in-progress"; }).sort(function(a,b){ return new Date(b.lastActivityAt||b.startedAt)-new Date(a.lastActivityAt||a.startedAt); })[0] : null;
    state.activeStudyId = latest ? latest.id : null;
    persistActiveState();
  }
  renderTab();
};

window.toggleSessionMode = function(){

    return;
  }

  renderTab();
};

function clearTick(){ if (tickTimer){ clearInterval(tickTimer); tickTimer = null; } }
function startTick(){
  clearTick();
  tickTimer = setInterval(function(){
    var steps = getTimerSteps();
    var stale = false;
    Object.keys(state.timers).forEach(function(stepId){
      var t = state.timers[stepId];
      if (!t || t.paused) return;
      var el = document.getElementById("clock-"+stepId);
      if (!el){ stale = true; return; }
      var ms = stepMsFor(stepId);
      el.textContent = fmtClock(ms);
      var step = steps.find(function(s){ return s.id === stepId; });
      var over = step && step.target ? (ms/1000 > step.target) : false;
      el.style.color = over ? "#f2b45a" : "var(--lcd-fg)";
    });
    if (stale) renderTab();
  }, 200);
}

  state.activeStudyId = inProgress ? inProgress.id : null;

window.stopAndRecordStep = function(stepId){
  var model = getTimerModel();
  var steps = getTimerSteps();
  var step = steps.find(function(s){ return s.id === stepId; });
  if (!model || !step) return;
  var durationSec = stepMsFor(stepId)/1000;
  var detail = getStepDetails(stepId);
  var rec = {
    id: uid(), cycleId: "rep-"+uid(), source:"Timer", studyId: state.activeStudyId||"", operatorName:state.operatorName||"", modelId: model.id, modelName: model.name,
    stepId: step.id, stepName: step.name, station: step.station,
    target: (step.target !== undefined && step.target !== null) ? step.target : null,
    duration: durationSec, netDuration: durationSec, timestamp: new Date().toISOString(), recordedDate:todayStr(),
    hc: detail.hc, workerId: detail.worker, session: detail.session, comment: detail.comment

  persistRecords(state.records.concat([rec]));
  delete state.timers[stepId];
  touchStudy(); persistActiveState();

  var n = state.records.filter(function(r){
    return r.modelId === model.id && r.stepId === step.id &&
      new Date(r.timestamp).getTime() >= state.sessionStart;
  }).length;
  var target = getStepReps(step, model);
  state.lastReading = { station: step.station, stepName: step.name, duration: durationSec, n: n, target: target };

};

function buildWideReportExport(records){
  var groups = {};
  records.slice().sort(function(a,b){ return new Date(a.timestamp)-new Date(b.timestamp); }).forEach(function(r){
    var stage = getStepStage(r.modelId, r.stepId);
    var date = r.recordedDate || dateKey(r.timestamp);
    var session = r.session || "";
    var hc = r.hc != null ? r.hc : "";
    var worker = r.workerId || "";
    var owner = r.operatorName || state.operatorName || "";
    var location = r.location || r.station || "";
    var load = r.load != null ? r.load : "";
    var key = [date, r.modelId, r.stepId, session, hc, worker, owner, location, load].join("|");
    if (!groups[key]) {
      groups[key] = {
        date: date, owner: owner, modelName: r.modelName || "", modelId: r.modelId, stage: stage || "",
        stepId: r.stepId, stepName: r.stepName || "", location: location, hc: hc,
        load: load, worker: worker, session: session, vals: [], comments: []
      };
    }
    var ct = recordCT(r);
    if (isFinite(ct)) groups[key].vals.push(Number(ct));
    if (r.comment) groups[key].comments.push(r.comment);
  });

  var headers = ["Date","Owner","Model","Stage","No","Steps","Location","HC","Load","Worker Identification(A,B,C)","Session"];
  var maxCT = Object.keys(groups).reduce(function(n,k){ return Math.max(n, groups[k].vals.length); }, 0);
  var ctCount = Math.max(maxCT, 5);
  for (var i=1;i<=ctCount;i++) headers.push("CT"+i);
  headers.push("Ave.CT","SD","Comment");

  var rows = Object.keys(groups).map(function(k){
    var g = groups[k];
    var model = state.models.find(function(m){ return m.id === g.modelId; });
    var no = "";
    if (model && model.steps) {
      var pos = model.steps.findIndex(function(st){ return st.id === g.stepId; });
      if (pos >= 0) no = pos + 1;
    }
    var row = [g.date,g.owner,g.modelName,g.stage,no,g.stepName,g.location,g.hc,g.load,g.worker,g.session];
    for (var i=0;i<ctCount;i++) row.push(g.vals[i] !== undefined ? Number(g.vals[i].toFixed(3)) : "");
    row.push(g.vals.length ? Number(mean(g.vals).toFixed(2)) : "");
    row.push(g.vals.length > 1 ? Number(sd(g.vals).toFixed(2)) : "");
    row.push(g.comments.filter(function(v,i,a){ return a.indexOf(v)===i; }).join(" | "));
    return row;
  });
  return {headers:headers, rows:rows};
}

function localDayMs(str, plusDays){
  var p = String(str).split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + (plusDays || 0)).getTime();
}
function getFilteredRecords(){
  return state.records.filter(function(r){
    if (state.reportFilterModel !== "all" && r.modelId !== state.reportFilterModel) return false;
    var t = new Date(r.timestamp).getTime();
    if (state.reportDateFrom && t < localDayMs(state.reportDateFrom, 0)) return false;
    if (state.reportDateTo && t >= localDayMs(state.reportDateTo, 1)) return false;
    return true;
  });
}
function recordCT(r){ return (r && r.netDuration != null) ? Number(r.netDuration) : Number(r.duration); }
function getStepStage(modelId, stepId){
  var m = state.models.find(function(mm){ return mm.id === modelId; });
  if (!m) return "";
  var s = m.steps.find(function(ss){ return ss.id === stepId; });
  return s ? (s.stage || "") : "";
}

function dateKey(ts){ var d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function prettyDate(k){ var p=k.split("-"); return p.length===3?p[1]+"/"+p[2]+"/"+p[0]:k; }
function buildDailyComparisonCard(model, filtered){
  var recs=filtered.filter(function(r){return r.modelId===model.id;});
  var byDate={}; recs.forEach(function(r){var k=dateKey(r.timestamp);(byDate[k]||(byDate[k]=[])).push(r);});
  var keys=Object.keys(byDate).sort();
  if(keys.length<2)return '<div class="card" style="margin-top:14px;font-size:12.5px;opacity:.7">Select a model with readings on at least 2 different dates to compare day-to-day CT.</div>';
  var rows=model.steps.map(function(st){var vals={};keys.forEach(function(k){var a=byDate[k].filter(function(r){return r.stepId===st.id;}).map(recordCT);vals[k]=a.length?mean(a):null;});return {step:st,vals:vals};});
  var totals={};keys.forEach(function(k){var a=rows.map(function(x){return x.vals[k];}).filter(function(v){return v!==null;});totals[k]=a.length?a.reduce(function(x,y){return x+y;},0):null;});
  var head='<th>Step</th>'+keys.map(function(k){return '<th class="num">'+esc(prettyDate(k))+'</th>';}).join("");
  var body=rows.map(function(x){return '<tr><td>'+esc(x.step.station)+' · '+esc(x.step.name)+'</td>'+keys.map(function(k){return '<td class="num mono" style="font-weight:600">'+(x.vals[k]!==null?fmtSec(x.vals[k]):'—')+'</td>';}).join("")+'</tr>';}).join("");
  body+='<tr style="font-weight:700;background:#f4f1e8"><td>Estimated total CT (sum of step averages)</td>'+keys.map(function(k){return '<td class="num mono">'+(totals[k]!==null?fmtSec(totals[k]):'—')+'</td>';}).join("")+'</tr>';
  return '<div class="card tbl-wrap" style="margin-top:14px"><div style="font-size:13px;font-weight:700">Day-to-day CT comparison — '+esc(model.name)+'</div><div style="font-size:11.5px;opacity:.6;margin:3px 0 8px">Each cell is the average net CT for that step on that date. The total row is the sum of step averages, not a measured single-server cycle unless the steps represent one complete serial cycle.</div><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}

function computeStepStats(filtered, groupBy){
  groupBy = groupBy || "step";
  var groups = {};
  filtered.forEach(function(r){
    var stage = getStepStage(r.modelId, r.stepId);
    var key;
    if (groupBy === "station") key = r.modelId+"|st|"+r.station;
    else if (groupBy === "stage") key = r.modelId+"|sg|"+(stage || "(no stage)");
    else key = r.modelId+"|sp|"+r.stepId;

    if (!groups[key]){
      groups[key] = {
        modelName: r.modelName,
        station: groupBy === "stage" ? null : r.station,
        stepName: groupBy === "step" ? r.stepName : null,
        stage: groupBy === "stage" ? (stage || "(no stage)") : stage,
        target: r.target, vals: []
      };
    }
    groups[key].vals.push(recordCT(r));
    if (groupBy !== "step" && (groups[key].target===null || groups[key].target===undefined) && r.target!==null && r.target!==undefined){
      groups[key].target = r.target;
    }
    if (groupBy === "station" && !groups[key].stage && stage) groups[key].stage = stage;
  });
  return Object.keys(groups).map(function(k){
    var g = groups[k];
    return {
      modelName:g.modelName, station:g.station, stepName:g.stepName, stage:g.stage, target:g.target,
      count:g.vals.length, avg:mean(g.vals), sd:sd(g.vals),
      min:Math.min.apply(null,g.vals), max:Math.max.apply(null,g.vals), med:median(g.vals)
    };
  }).sort(function(a,b){ return (a.modelName+(a.stage||"")+(a.station||"")).localeCompare(b.modelName+(b.stage||"")+(b.station||"")); });
}
function computeCycleStats(filtered){
  var byCycle = {};
  filtered.forEach(function(r){
    if (String(r.cycleId).indexOf("manual-") === 0) return;
    if (!byCycle[r.cycleId]) byCycle[r.cycleId] = { modelId:r.modelId, modelName:r.modelName, total:0, steps:0 };
    byCycle[r.cycleId].total += recordCT(r); byCycle[r.cycleId].steps += 1;
  });
  var stepCounts = {};
  state.models.forEach(function(m){ stepCounts[m.id] = m.steps.length; });
  var byModel = {};
  Object.keys(byCycle).forEach(function(cid){
    var c = byCycle[cid];
    if (stepCounts[c.modelId] && c.steps !== stepCounts[c.modelId]) return;
    if (!byModel[c.modelId]) byModel[c.modelId] = { modelName:c.modelName, vals:[] };
    byModel[c.modelId].vals.push(c.total);
  });
  return Object.keys(byModel).map(function(mid){
    var g = byModel[mid];
    return { modelName:g.modelName, count:g.vals.length, avg:mean(g.vals), sd:sd(g.vals),
      min:Math.min.apply(null,g.vals), max:Math.max.apply(null,g.vals) };
  });
}
function computeGroupTotals(model, filtered, field){
  var stats = computeStepStats(filtered.filter(function(r){ return r.modelId === model.id; }), field === "stage" ? "stage" : "station");
  var totals = {};
  stats.forEach(function(s){
    var label = field === "stage" ? (s.stage || "(no stage)") : s.station;
    totals[label] = (totals[label]||0) + s.avg;
  });
  return totals;
}
function paletteColor(i, total){
  var hue = Math.round(360 * i / Math.max(total,1));
  return "hsl("+hue+",56%,47%)";
}

/* bar chart: average CT (bar) + current/max CT (dot), with overall reference lines */
function buildBarSDChartSVG(data, overallAvg){
  var n = data.length || 1;
  var w = Math.max(640, n*72+60), h = 264;
  var pad = { top:24, right:16, bottom:58, left:34 };
  var innerW = w-pad.left-pad.right, innerH = h-pad.top-pad.bottom;
  var scaleMax = Math.max(overallAvg, Math.max.apply(null, data.map(function(d){return d.avg;}).concat([0.001]))) * 1.25;
  var gap = innerW/n;
  var barW = Math.min(gap*0.5, 40);
  function yFor(v){ return pad.top + innerH - (v/scaleMax*innerH); }

  var bottleneck = data.reduce(function(best,d){ return (!best || d.avg > best.avg) ? d : best; }, null);

  var grid = "";
  for (var g=0; g<=4; g++){
    var gv = scaleMax*g/4, gy = yFor(gv);
    grid += '<line x1="'+pad.left+'" y1="'+gy.toFixed(1)+'" x2="'+(w-pad.right)+'" y2="'+gy.toFixed(1)+'" stroke="#e2ded3" stroke-width="1"/>'
      + '<text x="'+(pad.left-6)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" text-anchor="end" fill="#8a8578">'+gv.toFixed(0)+'</text>';
  }
  var avgY = yFor(overallAvg);
  var refLines = '<line x1="'+pad.left+'" y1="'+avgY.toFixed(1)+'" x2="'+(w-pad.right)+'" y2="'+avgY.toFixed(1)+'" stroke="#0e6e66" stroke-width="1.4" stroke-dasharray="5 4"></line>';
  if (bottleneck){
    var bnY = yFor(bottleneck.avg);
    refLines += '<line x1="'+pad.left+'" y1="'+bnY.toFixed(1)+'" x2="'+(w-pad.right)+'" y2="'+bnY.toFixed(1)+'" stroke="#b3452c" stroke-width="1.6" stroke-dasharray="6 3"></line>'
      + '<text x="'+(w-pad.right)+'" y="'+(bnY-4).toFixed(1)+'" font-size="9.5" text-anchor="end" fill="#b3452c" font-weight="700">Bottleneck '+bottleneck.avg.toFixed(1)+'s</text>';
  }

  var bars = data.map(function(d,i){
    var x = pad.left + i*gap + (gap-barW)/2;
    var barTop = yFor(d.avg);
    var barBottom = pad.top+innerH;
    var barH = barBottom - barTop;
    var isBottleneck = bottleneck && d === bottleneck;
    var color = (d.target && d.avg > d.target) ? "#b3452c" : "#0e6e66";
    var lx = x + barW/2;
    var sdY = Math.min(barBottom - 16, barTop + 18); // keep the SD chip inside the bar when possible
    var sdLabel = (d.sd !== null && d.sd !== undefined) ? d.sd.toFixed(1) : "–";
    return '<rect x="'+x.toFixed(1)+'" y="'+barTop.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(barH,1).toFixed(1)+'" rx="3" fill="'+color+'" opacity="0.88" '
      + (isBottleneck ? 'stroke="#b3452c" stroke-width="2.4"' : '') + '></rect>'
      + '<text x="'+lx.toFixed(1)+'" y="'+(barTop-8).toFixed(1)+'" font-size="10.5" text-anchor="middle" fill="#221f1a" font-weight="700">'+d.avg.toFixed(1)+'</text>'
      + '<rect x="'+(lx-12).toFixed(1)+'" y="'+(sdY-8).toFixed(1)+'" width="24" height="14" rx="4" fill="rgba(0,0,0,0.5)"></rect>'
      + '<text x="'+lx.toFixed(1)+'" y="'+(sdY+3).toFixed(1)+'" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="700">'+sdLabel+'</text>'
      + '<text x="'+lx.toFixed(1)+'" y="'+(h-pad.bottom+14).toFixed(1)+'" font-size="9.5" text-anchor="middle" fill="'+(isBottleneck?"#b3452c":"#6b665b")+'" font-weight="'+(isBottleneck?"700":"400")+'" transform="rotate(-20 '+lx.toFixed(1)+' '+(h-pad.bottom+14).toFixed(1)+')">'+esc(d.label)+'</text>';
  }).join("");

  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" xmlns="http://www.w3.org/2000/svg">'+grid+refLines+bars+'</svg>'
    + '<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11px;margin-top:6px">'
    + '<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#0e6e66;vertical-align:middle;margin-right:4px"></span>Bar height &amp; number on top = average CT — dashed line: overall average ('+overallAvg.toFixed(1)+'s)</span>'
    + (bottleneck ? '<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#b3452c;vertical-align:middle;margin-right:4px"></span>Red dashed line = bottleneck station: '+esc(bottleneck.label)+' ('+bottleneck.avg.toFixed(1)+'s)</span>' : "")
    + '<span><span style="display:inline-block;width:20px;height:12px;border-radius:3px;background:rgba(0,0,0,0.5);vertical-align:middle;margin-right:4px"></span>Number in dark box = SD for that step</span>'
    + '</div>';
}

/* line chart: reading-by-reading fluctuation per step, plus bold average line */
function buildFluctuationSVG(model, filtered){
  var steps = model.steps;
  if (!steps.length) return '<div style="font-size:12.5px;opacity:.55">No steps to chart.</div>';
  var perStep = steps.map(function(s){
    var vals = filtered.filter(function(r){ return r.modelId === model.id && r.stepId === s.id; })
      .sort(function(a,b){ return new Date(a.timestamp)-new Date(b.timestamp); })
      .map(function(r){ return recordCT(r); });
    return { step:s, vals:vals };
  });
  var maxReps = Math.min(8, Math.max.apply(null, perStep.map(function(p){ return p.vals.length; }).concat([0])));
  if (maxReps === 0) return '<div style="font-size:12.5px;opacity:.55">No readings yet for this model.</div>';

  var n = steps.length;
  var w = Math.max(640, n*70+60), h = 240;
  var pad = { top:14, right:14, bottom:56, left:34 };
  var innerW = w-pad.left-pad.right, innerH = h-pad.top-pad.bottom;
  var allVals = [];
  perStep.forEach(function(p){ p.vals.forEach(function(v){ allVals.push(v); }); });
  var maxVal = Math.max.apply(null, allVals.concat([0.001])) * 1.15;

  function xFor(i){ return pad.left + (n<=1 ? innerW/2 : innerW*i/(n-1)); }
  function yFor(v){ return pad.top + innerH - (v/maxVal*innerH); }

  var grid = "";
  for (var g=0; g<=4; g++){
    var gv = maxVal*g/4, gy = yFor(gv);
    grid += '<line x1="'+pad.left+'" y1="'+gy.toFixed(1)+'" x2="'+(w-pad.right)+'" y2="'+gy.toFixed(1)+'" stroke="#e2ded3" stroke-width="1"/>'
      + '<text x="'+(pad.left-6)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" text-anchor="end" fill="#8a8578">'+gv.toFixed(0)+'</text>';
  }

  var repColors = ["#e8a978","#e08a5c","#d9784a","#c96a3e","#b85c33","#a64f2a","#943f1f","#7f3316"];
  var repLines = "";
  for (var rep=0; rep<maxReps; rep++){
    var pts = [];
    for (var i=0;i<n;i++){
      var v = perStep[i].vals[rep];
      if (v === undefined) continue;
      pts.push(xFor(i).toFixed(1)+","+yFor(v).toFixed(1));
    }
    if (pts.length > 1) repLines += '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+repColors[rep%repColors.length]+'" stroke-width="1.4" opacity="0.75"></polyline>';
  }
  var avgPts = perStep.map(function(p,i){
    if (!p.vals.length) return null;
    var a = mean(p.vals);
    return xFor(i).toFixed(1)+","+yFor(a).toFixed(1);
  }).filter(Boolean);
  var avgLine = avgPts.length > 1 ? '<polyline points="'+avgPts.join(" ")+'" fill="none" stroke="#221f1a" stroke-width="2.6" stroke-linejoin="round"></polyline>' : "";

  var labels = steps.map(function(s,i){
    var x = xFor(i);
    return '<text x="'+x.toFixed(1)+'" y="'+(h-pad.bottom+14).toFixed(1)+'" font-size="9.5" text-anchor="middle" fill="#6b665b" transform="rotate(-20 '+x.toFixed(1)+' '+(h-pad.bottom+14).toFixed(1)+')">'+esc(s.station)+'</text>';
  }).join("");

  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" xmlns="http://www.w3.org/2000/svg">'+grid+repLines+avgLine+labels+'</svg>'
    + '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;margin-top:6px;opacity:.8">'
    + '<span><span style="display:inline-block;width:14px;height:2.6px;background:#221f1a;vertical-align:middle;margin-right:4px"></span>Average</span>'
    + '<span><span style="display:inline-block;width:14px;height:1.4px;background:#c96a3e;vertical-align:middle;margin-right:4px"></span>Individual readings, in the order recorded</span>'
    + '</div>';
}

/* donut: % contribution of each station to the model's total average cycle time */
function buildDonutSVG(byStation){
  var entries = Object.keys(byStation).map(function(k){ return { label:k, value: byStation[k] }; })
    .sort(function(a,b){ return b.value-a.value; });
  var total = entries.reduce(function(a,e){ return a+e.value; }, 0) || 1;
  var size = 180, r = 62, sw = 26, cx = size/2, cy = size/2;
  var circumference = 2*Math.PI*r;
  var acc = 0;
  var arcs = entries.map(function(e,i){
    var frac = e.value/total;
    var len = frac*circumference;
    var dasharray = len.toFixed(2)+" "+(circumference-len).toFixed(2);
    var dashoffset = (-acc).toFixed(2);
    acc += len;
    var color = paletteColor(i, entries.length);
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-dasharray="'+dasharray+'" stroke-dashoffset="'+dashoffset+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
  }).join("");
  var svg = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#eee" stroke-width="'+sw+'"></circle>'
    + arcs
    + '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">'+total.toFixed(1)+'s</text>'
    + '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="9" fill="#6b665b">avg total</text>'
    + '</svg>';
  var legend = entries.map(function(e,i){
    var pct = (e.value/total*100).toFixed(1);
    var color = paletteColor(i, entries.length);
    return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0">'
      + '<span style="width:9px;height:9px;border-radius:50%;background:'+color+';display:inline-block;flex-shrink:0"></span>'
      + '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e.label)+'</span>'
      + '<span class="mono" style="font-weight:600;opacity:.75">'+pct+'%</span></div>';
  }).join("");
  return '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><div>'+svg+'</div><div style="flex:1;min-width:160px">'+legend+'</div></div>';
}

function slugKey(s){ return String(s==null?"":s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

/* match an imported row's Model/Station/Step to a real model+step if one exists;
   otherwise fall back to a stable synthetic id so repeats of the same step still group together */
function resolveModelStep(modelName, station, stepName, stage){
  var mn = String(modelName||"").trim(), st = String(station||"").trim(), sn = String(stepName||"").trim(), sg = String(stage||"").trim();
  var m = state.models.find(function(mm){ return String(mm.name||"").trim().toLowerCase() === mn.toLowerCase(); });
  if (m){
    var s = m.steps.find(function(ss){
      var sameStep = String(ss.name||"").trim().toLowerCase() === sn.toLowerCase();
      var sameStation = !st || String(ss.station||"").trim().toLowerCase() === st.toLowerCase();
      var sameStage = !sg || String(ss.stage||"").trim().toLowerCase() === sg.toLowerCase();
      return sameStep && sameStation && sameStage;
    });
    if (!s && sn){
      s = m.steps.find(function(ss){
        return String(ss.name||"").trim().toLowerCase() === sn.toLowerCase();
      });
    }
    if (s) return { modelId:m.id, modelName:m.name, stepId:s.id, stepName:s.name, station:s.station, target:s.target };
  }
  return {
    modelId: "import:"+slugKey(mn), modelName: mn || "Imported",
    stepId: "import:"+slugKey(mn+"|"+sg+"|"+st+"|"+sn), stepName: sn || st || "Step",
    station: st, target: null
  };
}

window.handleImportRecords = function(evt){
  var file = evt.target.files && evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = async function(){
    try {
      var rows = await parseImportFile(reader.result, file.name);
      var newRecs = [];
      var isReportWide = rows.length && Object.keys(rows[0]).some(function(k){ return /^ct\s*\d+$/i.test(String(k).trim()); });

      if (isReportWide){
        // Report import uses the same wide format produced by Export Excel:
        // Date, Owner, Model, Stage, No, Steps, Location, HC, Load,
        // Worker Identification(A,B,C), Session, CT1...CTn, Ave.CT, SD, Comment.
        rows.forEach(function(row, ri){
          var modelName = String(row["Model"] || "").trim();
          var stage = String(row["Stage"] || "").trim();
          var stepName = String(row["Steps"] || row["Step"] || "").trim();
          var location = String(row["Location"] || "").trim();
          var base = resolveModelStep(modelName, location, stepName, stage);
          var target = row["Target (s)"] !== undefined && row["Target (s)"] !== "" ? Number(row["Target (s)"]) : base.target;
          var dateText = String(row["Date"] || "").trim();
          var owner = String(row["Owner"] || "").trim();
          var worker = String(row["Worker Identification(A,B,C)"] || row["Worker Identification"] || "").trim();
          var session = String(row["Session"] || "").trim();
          var hc = row["HC"] !== undefined && row["HC"] !== "" ? Math.max(1, parseInt(row["HC"],10) || 1) : 1;
          var load = row["Load"] !== undefined ? row["Load"] : "";
          var comment = String(row["Comment"] || "").trim();
          var repKeys = Object.keys(row).filter(function(k){ return /^ct\s*\d+$/i.test(String(k).trim()); })
            .sort(function(a,b){ return parseInt(String(a).replace(/\D/g,""),10) - parseInt(String(b).replace(/\D/g,""),10); });
          var baseTs = parseImportedDate(dateText, Date.now() + ri*60000);
          repKeys.forEach(function(k, idx){
            var v = parseFloat(row[k]);
            if (isNaN(v) || v <= 0) return;
            newRecs.push({
              id: uid(), cycleId: "import-"+uid(),
              modelId: base.modelId, modelName: base.modelName,
              stepId: base.stepId, stepName: base.stepName, station: base.station,
              target: (target!==undefined && target!==null && !isNaN(target)) ? target : null,
              duration: v, netDuration: v,
              timestamp: new Date(baseTs + idx*1000).toISOString(),
              hc: hc, workerId: worker, session: session, comment: comment,
              operatorName: owner, load: load, location: location, source: "Import"
            });
          });
        });
      } else {
        // Backward-compatible import for the older one-reading-per-row format.
        rows.forEach(function(row){
          var d = parseFloat(row["Duration (s)"] || row["Duration"] || row["duration"]);
          if (!d || isNaN(d)) return;
          var base = resolveModelStep(row["Model"], row["Station"] || row["Location"], row["Step"] || row["Steps"], row["Stage"]);
          var target = row["Target (s)"] !== undefined && row["Target (s)"] !== "" ? Number(row["Target (s)"]) : base.target;
          newRecs.push({
            id: uid(), cycleId: row["CycleId"] || ("import-"+uid()),
            modelId: base.modelId, modelName: base.modelName,
            stepId: base.stepId, stepName: base.stepName, station: base.station,
            target: (target!==undefined && target!==null && !isNaN(target)) ? target : null,
            duration: d, netDuration: d,
            timestamp: row["Timestamp"] ? new Date(row["Timestamp"]).toISOString() : new Date().toISOString(),
            hc: row["HC"] !== undefined && row["HC"] !== "" ? Math.max(1,parseInt(row["HC"],10)||1) : 1,
            workerId: row["Worker Identification(A,B,C)"] || row["Worker Identification"] || row["Worker"] || "",
            session: row["Session"] || "", comment: row["Comment"] || "",
            operatorName: row["Owner"] || "", load: row["Load"] || "", location: row["Location"] || row["Station"] || "", source: "Import"
          });
        });
      }

      if (!newRecs.length) throw new Error("No CT readings found");
      persistRecords(state.records.concat(newRecs));
      showToast("Imported "+newRecs.length+" CT reading(s) from Excel");
      renderTab();
    } catch(e){ showToast("Import failed — check the agreed Excel report format", "err"); }
    finally { evt.target.value = ""; }
  };
  if (/\.xlsx$/i.test(file.name)) reader.readAsArrayBuffer(file); else reader.readAsText(file);
};
function parseImportedDate(value, fallback){
  var s = String(value || "").trim();
  if (!s) return fallback;
  if (/^\d+(?:\.\d+)?$/.test(s)) {
    var serial = Number(s);
    if (serial > 20000 && serial < 100000) return Date.UTC(1899,11,30) + serial * 86400000;
  }
  var d = new Date(s);
  if (!isNaN(d.getTime())) return d.getTime();
  var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m){
    var yr = Number(m[3]); if (yr < 100) yr += 2000;
    d = new Date(yr, Number(m[1])-1, Number(m[2]));
    if (!isNaN(d.getTime())) return d.getTime();
  }
  return fallback;
}
window.handleImportModels = function(evt){
  var file = evt.target.files && evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  function txt(v){ return (v === null || v === undefined) ? "" : String(v).trim(); }
  function low(v){ return txt(v).toLowerCase(); }
  function numOrNull(v){ if (v === undefined || v === null || v === "") return null; var n = Number(v); return isNaN(n) ? null : n; }
  reader.onload = async function(){
    try {
      var rows = await parseImportFile(reader.result, file.name);
      // Merge into existing data: never wipe models (or the link to their saved readings).
      var models = state.models.map(function(m){ return Object.assign({}, m, { steps: m.steps.slice() }); });
      var existingKeys = {};
      state.models.forEach(function(m){
        existingKeys[m.id] = m.steps.map(function(s){ return [low(s.stage), low(s.station), low(s.name)]; });
      });
      var addedModels = 0, addedSteps = 0, skipped = 0, firstTouched = null, importedRecords = [];
      rows.forEach(function(row){
        var mName = txt(row["Model"]);
        var stepName = txt(row["Step"]) || txt(row["Steps"]);
        if (!mName || !stepName) return;
        var model = models.find(function(m){ return low(m.name) === mName.toLowerCase(); });
        if (!model){
          model = { id: uid(), name: mName, code: "", targetSamples: 5, steps: [] };
          models.push(model); addedModels++;
        }
        var stage = txt(row["Stage"]);
        var stationIn = txt(row["Station"]) || txt(row["Location"]);
        var seen = existingKeys[model.id] || [];
        var isDup = seen.some(function(k){
          return k[0] === stage.toLowerCase() && k[2] === stepName.toLowerCase() && (!stationIn || k[1] === stationIn.toLowerCase());
        });
        if (isDup){ skipped++; return; }
        var stepId = uid();
        var station = stationIn || ("Station " + (model.steps.length + 1));
        var target = numOrNull(row["Target (s)"]);
        var hc = Math.max(1, parseInt(row["HC"], 10) || 1);
        var session = txt(row["Session"]), comment = txt(row["Comment"]);
        model.steps.push({
          id: stepId, stage: stage, station: station, name: stepName, target: target,
          reps: (row["Reps"] !== undefined && row["Reps"] !== "") ? Math.max(1, parseInt(row["Reps"],10)||1) : (model.targetSamples || 5),
          hc: hc, worker: "", session: session, comment: comment
        });
        addedSteps++;
        if (!firstTouched) firstTouched = model;
        Object.keys(row).filter(function(k){ return /^ct\s*\d+$/i.test(k.trim()); })
          .sort(function(a,b){ return parseInt(a.replace(/\D/g,""),10)-parseInt(b.replace(/\D/g,""),10); })
          .forEach(function(k){
            var v = parseFloat(row[k]);
            if (!isNaN(v) && v > 0){
              importedRecords.push({
                id: uid(), cycleId: "import-"+uid(), modelId: model.id, modelName: model.name, stepId: stepId,
                stepName: stepName, station: station, target: target, duration: v, netDuration: v,
                timestamp: new Date(Date.now()+importedRecords.length*1000).toISOString(),
                hc: hc, workerId: "", session: session, comment: comment, source: "Import"
              });
            }
          });
      });
      if (!addedSteps){
        showToast(skipped ? "Nothing new - those steps already exist" : "No steps found - the file needs Model and Step columns", "err");
        return;
      }
      persistModels(models);
      if (importedRecords.length) persistRecords(state.records.concat(importedRecords));
      state.modelsSelId = firstTouched.id;
      state.modelsSelStepId = firstTouched.steps.length ? firstTouched.steps[0].id : null;
      if (!anyTimerActive()){
        state.timerModelId = firstTouched.id; state.activeStudyId = null;
        state.sessionStart = Date.now(); state.lastReading = null; persistActiveState();
      }
      showToast("Added " + addedSteps + " step(s)" + (addedModels ? " in " + addedModels + " new model(s)" : "") + (skipped ? " - " + skipped + " already existed, skipped" : ""));
      renderTab();
    } catch(e){ showToast("Import failed - check the Excel format (Model / Stage / Step)", "err"); }
    finally { evt.target.value = ""; }
  };
  if (/\.xlsx$/i.test(file.name)) reader.readAsArrayBuffer(file); else reader.readAsText(file);
};

    + '<button class="btn btn-outline" style="padding:5px 9px;font-size:11px" onclick="toggleStudyMode()">'+(state.studyMode?'On':'Off')+'</button>'
    + '</div>'
    + (state.studyMode ? (
        '<div style="display:flex;flex-direction:column;gap:7px">'
        + '<div class="field-label">Operator / User</div>'
        + '<input type="text" value="'+esc(state.operatorName)+'" placeholder="Your name or ID" onchange="setOperatorName(this.value)" />'
        + (getActiveStudy() ? '<div style="font-size:12px;font-weight:600;color:var(--teal-dark)">'+esc(getActiveStudy().name)+'</div><div style="font-size:11px;opacity:.55">Started '+new Date(getActiveStudy().startedAt).toLocaleDateString()+' · Last activity '+new Date(getActiveStudy().lastActivityAt).toLocaleString()+'</div>' : '<div style="font-size:11.5px;opacity:.55">No active study yet. Start a timer or create a new study.</div>')
        + '<div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn btn-outline" style="padding:6px 9px;font-size:11.5px" onclick="startNewStudy()">New study</button>'
        + (getActiveStudy() ? '<button class="btn btn-outline" style="padding:6px 9px;font-size:11.5px" onclick="finishStudy()">Finish study</button>' : '') + '</div>'
        + '</div>'
        + '<div style="border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px">'
        + '<div class="field-label">In-progress studies</div>'
        + (state.studies.filter(function(st){ return st.status === "in-progress"; }).length ? state.studies.filter(function(st){ return st.status === "in-progress"; }).sort(function(a,b){ return new Date(b.lastActivityAt||b.startedAt)-new Date(a.lastActivityAt||a.startedAt); }).map(function(st){ return '<button class="model-list-btn" data-active="'+(st.id===state.activeStudyId?'1':'0')+'" onclick="continueStudy(\''+st.id+'\')"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(st.name)+'</span><span style="font-size:10px;opacity:.55">'+new Date(st.lastActivityAt||st.startedAt).toLocaleDateString()+'</span></button>'; }).join("") : '<div style="font-size:11px;opacity:.55">No in-progress studies.</div>')
        + '</div>'
      ) : '')
    + '</div>'
    + (model ? (
        '<div style="font-size:12px;font-weight:500;color:'+(allMet?"var(--teal-dark)":"#6b665b")+'">'+stepsMet+'/'+steps.length+' steps have the reps they need'+(allMet?" — stage complete ✓":"")+'</div>'
        + '<button class="btn-link" style="align-self:flex-start" onclick="resetProgress()">Reset progress</button>'
      ) : "")
    + '<div style="border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px">'
    + '<div class="row" style="justify-content:space-between;align-items:center;gap:8px">'
    + '<div><div class="field-label">Session details</div><div style="font-size:11px;opacity:.55">Optional — turn on only when needed.</div></div>'
    + '<button class="btn btn-outline" style="padding:5px 9px;font-size:11px" onclick="toggleSessionMode()">'+(state.sessionMode?'On':'Off')+'</button>'
    + '</div>'
    + (state.sessionMode ? '<div style="font-size:11px;opacity:.55">HC, Worker, Session/Run and Step Note appear under each step.</div>' : '')
    + '</div>'
    + '</div>';

  /* center: every step is its own independent stopwatch — start as many at once as you like */
  var lastReading = state.lastReading ? (
    '<div class="card" style="font-size:12.5px;padding:10px 12px;background:#e7f2ef;color:var(--teal-dark)">'
    + 'Recorded '+fmtSec(state.lastReading.duration)+' for '+esc(state.lastReading.station)+' — '+esc(state.lastReading.stepName)+'. '
    + state.lastReading.n+'/'+state.lastReading.target+' reading'+(state.lastReading.target===1?"":"s")+' for this step so far.'
    + (allMet ? " All steps have reached the reps needed for this stage." : "")
    + '</div>'
  ) : "";

  var rows = "";
  var lastStage = null;
  steps.forEach(function(s,i){
    rows += buildInsertGap("timerInsertStepAt", i);
    var stg = s.stage || "";
    if (stg !== lastStage){
      rows += '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.45;padding:10px 4px 2px">'+(stg?esc(stg):"No stage")+'</div>';
      lastStage = stg;
    }
    var t = timerEntry(s.id);
    var running = !!t;
    var paused = running && t.paused;
    var reps = getStepReps(s, model);
    var n = progress[s.id] || 0, met = n >= reps;
    var ms = running ? stepMsFor(s.id) : 0;
    var over = running && s.target ? (ms/1000 > s.target) : false;

    var controls;
    if (!running){
      controls = '<button class="btn btn-primary" style="padding:7px 12px;font-size:12.5px" onclick="startStep(\''+s.id+'\')">'+ICO.play+' Start</button>';
    } else {
      controls = '<button class="btn btn-primary" style="padding:7px 12px;font-size:12.5px" onclick="togglePause(\''+s.id+'\')">'+(paused ? 'Resume' : 'Pause')+'</button>'
        + '<button class="btn btn-danger" style="padding:7px 12px;font-size:12.5px" onclick="stopAndRecordStep(\''+s.id+'\')">Stop</button>'
        + '<button class="btn btn-outline" style="padding:7px 12px;font-size:12.5px" onclick="discardTiming(\''+s.id+'\')">Discard</button>';
    }

    var sessionReadings = state.records.filter(function(r){
      var inStudy=state.activeStudyId ? r.studyId===state.activeStudyId : new Date(r.timestamp).getTime()>=state.sessionStart;
      return r.modelId===model.id && r.stepId===s.id && inStudy;
    }).sort(function(a,b){ return new Date(a.timestamp) - new Date(b.timestamp); });
    var expanded = !!state.expandedSteps[s.id];

    var manualCTUI = '<div class="row" style="gap:6px;align-items:center;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;flex-wrap:wrap">'
      + '<span class="field-label" style="margin:0">Manual CT</span>'
      + '<input id="manual-duration-'+s.id+'" type="number" min="0.1" step="0.1" placeholder="sec/server" style="width:120px" />'
      + '<button class="btn btn-outline" style="padding:6px 10px;font-size:11.5px" onclick="manualSubmit(\''+s.id+'\')">Add CT</button>'
      + '<span style="font-size:10.5px;opacity:.5">Counts as 1 reading</span>'
      + '</div>';


    var stepDetail = getStepDetails(s.id);
    var stepDetailUI = state.sessionMode ? '<div style="display:grid;grid-template-columns:70px 80px minmax(90px,1fr) minmax(90px,1fr);gap:6px;align-items:center;padding-top:6px;border-top:1px solid var(--line);margin-top:4px">'
      + '<input type="number" min="1" step="1" value="'+stepDetail.hc+'" title="Headcount" placeholder="HC" onchange="timerUpdateStepDetail(\''+s.id+'\',\'hc\',this.value)" />'
      + '<input type="text" value="'+esc(stepDetail.worker)+'" title="Worker" placeholder="Worker" onchange="timerUpdateStepDetail(\''+s.id+'\',\'worker\',this.value)" />'
      + '<input type="text" value="'+esc(stepDetail.session)+'" title="Session / lot / run" placeholder="Session / Run" onchange="timerUpdateStepDetail(\''+s.id+'\',\'session\',this.value)" />'
      + '<input type="text" value="'+esc(stepDetail.comment)+'" title="Step detail" placeholder="Step detail / note" onchange="timerUpdateStepDetail(\''+s.id+'\',\'comment\',this.value)" />'
      + '</div>' : "";

    var toggleLine = sessionReadings.length ? (
      '<button onclick="toggleStepReadings(\''+s.id+'\')" style="all:unset;cursor:pointer;font-size:11px;color:var(--teal-dark);font-weight:600;padding-top:2px">'
      + (expanded ? "▾ " : "▸ ") + sessionReadings.length + " reading" + (sessionReadings.length===1?"":"s") + (expanded ? "" : " — click to review")
      + '</button>'
    ) : "";

    var readingsChips = (expanded && sessionReadings.length) ? (
      '<div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:4px">'
      + sessionReadings.map(function(r, idx){
          var overR = r.target && r.duration > r.target;
          return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 7px;border-radius:7px;background:var(--paper);border:1px solid var(--line);color:'+(overR?"var(--red)":"var(--ink)")+'">'
            + (idx+1)+'. Net '+fmtSec(r.netDuration != null ? r.netDuration : r.duration)
            + '<button onclick="deleteRecord(\''+r.id+'\')" title="Delete this reading" style="all:unset;cursor:pointer;color:var(--red);font-weight:700;line-height:1;padding:0 2px">×</button>'
            + '</span>';
        }).join("")
      + '</div>'
    ) : "";

    rows += '<div class="card" style="display:flex;flex-direction:column;gap:2px;padding:10px 12px;'
      + (running ? (paused ? 'border-color:var(--amber)' : 'border-color:var(--teal)') : '') + '">'
      + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
      + '<span class="mono" style="font-size:10.5px;font-weight:700;opacity:.5;flex-shrink:0">S'+(i+1)+'</span>'
      + '<input type="text" value="'+esc(s.name)+'" '+(running?"disabled":"")+' onchange="timerUpdateStepField(\''+s.id+'\',\'name\',this.value)" style="flex:1;min-width:120px;font-weight:500" />'
      + '<span class="step-badge" style="background:'+(met?"#e7f2ef":"rgba(0,0,0,.06)")+';color:'+(met?"var(--teal-dark)":"#8a8578")+'">'+n+'/'+reps+'</span>'
      + '<span id="clock-'+s.id+'" class="mono" style="font-size:17px;font-weight:700;min-width:82px;text-align:right;color:'+(running?(over?"#c96a1f":"var(--teal-dark)"):"#b7b2a3")+'">'+fmtClock(ms)+'</span>'
      + (running && paused ? '<span style="font-size:10px;font-weight:600;color:var(--amber);text-transform:uppercase">Paused</span>' : "")
      + '<div class="row" style="gap:4px">'+controls+'</div>'
      + '</div>'
      + manualCTUI + stepDetailUI + toggleLine + readingsChips
      + '</div>';
  });
  if (steps.length) rows += buildInsertGap("timerInsertStepAt", steps.length);

  var stepsBlock = '<div style="display:flex;flex-direction:column;gap:6px">'
    + '<div class="row" style="justify-content:space-between">'
    + '<div style="font-size:12px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.04em">Stations ('+steps.length+') — start as many at once as you like</div>'
    + '<button class="btn btn-outline" style="padding:6px 10px;font-size:12px" '+(!model?"disabled":"")+' onclick="timerAddStep()">'+ICO.plus+' Add step</button>'
    + '</div>'
    + (steps.length ? rows : '<div class="card" style="font-size:12.5px;opacity:.55">No steps yet — click "Add step" or set them up in Models &amp; Steps.</div>')
    + '</div>';

  var hint = '<div style="font-size:11.5px;opacity:.55">Each station is its own stopwatch — start several at once, they run independently. Click a step name to rename it (only while it\'s stopped). Pause/discard controls appear once a station is running.</div>';

  var mid = '<div style="display:flex;flex-direction:column;gap:12px">' + lastReading + stepsBlock + hint + '</div>';

  var recent = state.records.slice().sort(function(a,b){ return new Date(b.timestamp)-new Date(a.timestamp); }).slice(0,8);
  var recentHtml = recent.length ? recent.map(function(r){
    var over = r.target && recordCT(r) > r.target;
    return '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)">'
      + '<div style="min-width:0"><div style="font-weight:500">'+esc(r.station)+' · '+esc(r.stepName)+'</div><div style="opacity:.55;font-size:11px">'+esc(r.modelName)+'</div></div>'
      + '<div class="mono" style="font-weight:600;color:'+(over?"var(--red)":"var(--teal-dark)")+'">'+fmtSec(r.duration)+'</div></div>';
  }).join("") : '<div style="font-size:12.5px;opacity:.55">Nothing recorded yet — start a station above to see readings here.</div>';

  var right =
    '<div style="display:flex;flex-direction:column;gap:14px">'
    + '<div class="card" style="flex:1;min-height:180px"><div style="font-size:13px;font-weight:600;margin-bottom:10px">Recent readings</div>'+recentHtml+'</div>'
    + '</div>';

  return '<div class="grid-timer-3">'+left+mid+right+'</div>';
}

/* ---------------- Models tab ---------------- */
function renderModelsTab(){
  var sel = state.models.find(function(m){ return m.id === state.modelsSelId; }) || null;
  if (sel && sel.steps.length && !sel.steps.find(function(s){ return s.id === state.modelsSelStepId; })){
    state.modelsSelStepId = sel.steps[0].id;
  }
  if (sel && !sel.steps.length) state.modelsSelStepId = null;
  if (!sel) state.modelsSelStepId = null;

  var tools = '<div class="row" style="margin-bottom:12px">'
    + '<button class="btn btn-outline" style="padding:8px 12px;font-size:12.5px" onclick="downloadStepsTemplate()">'+ICO.dl+' Download Excel template</button>'
    + '<button class="btn btn-outline" style="padding:8px 12px;font-size:12.5px" onclick="triggerImportModels()">'+ICO.ul+' Import steps from Excel</button>'
    + '<span style="font-size:11.5px;opacity:.55">Use the simple Excel template: Model / Stage / Step. Add one row for each step, then import it.</span>'
    + '</div>';

  var list = state.models.map(function(m){
    return '<button class="model-list-btn" data-active="'+(state.modelsSelId===m.id?"1":"0")+'" onclick="modelsSelect(\''+m.id+'\')">'
      + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.name)+'</span>'
      + '<span style="font-size:11px;opacity:.5">'+m.steps.length+'</span></button>';
  }).join("");
  var modelsPane = '<div class="card" style="display:flex;flex-direction:column;gap:4px;height:fit-content">'
    + '<div class="row" style="justify-content:space-between;padding:0 2px 4px">'
    + '<div style="font-size:12px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.04em">Models</div>'
    + '<button class="btn-link" style="text-decoration:none;font-size:15px" onclick="addModel()">'+ICO.plus+'</button></div>'
    + (state.models.length ? list : '<div style="font-size:12.5px;opacity:.55;padding:6px 2px">No models yet.</div>')
    + '</div>';

  var stepsPane, editorPane;
  if (!sel){
    stepsPane = '<div class="card" style="font-size:12.5px;opacity:.55">Select or add a model.</div>';
    editorPane = "";
  } else {
    var stepItems = "";
    var lastStage = null;
    sel.steps.forEach(function(s,i){
      stepItems += buildInsertGap("modelsInsertStepAt", i);
      var stg = s.stage || "";
      if (stg !== lastStage){
        stepItems += '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.45;padding:8px 6px 2px">'+(stg?esc(stg):"No stage")+'</div>';
        lastStage = stg;
      }
      var active = s.id === state.modelsSelStepId;
      stepItems += '<button class="model-list-btn" data-active="'+(active?"1":"0")+'" onclick="modelsSelectStep(\''+s.id+'\')">'
        + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i+1)+'. '+esc(s.station)+' · '+esc(s.name)+'</span></button>';
    });
    if (sel.steps.length) stepItems += buildInsertGap("modelsInsertStepAt", sel.steps.length);
    stepsPane = '<div class="card" style="display:flex;flex-direction:column;gap:4px;height:fit-content;max-height:540px;overflow-y:auto">'
      + '<div class="row" style="justify-content:space-between;padding:0 2px 4px">'
      + '<div style="font-size:12px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.04em">Steps ('+sel.steps.length+')</div>'
      + '<button class="btn-link" style="text-decoration:none;font-size:15px" onclick="addStep()">'+ICO.plus+'</button></div>'
      + '<div class="row" style="gap:6px;padding:0 2px 6px"><label class="field-label" style="white-space:nowrap">Default reps for new steps</label>'
      + '<input type="number" min="1" step="1" value="'+(sel.targetSamples||5)+'" onchange="updateModelField(\''+sel.id+'\',\'targetSamples\',Math.max(1,parseInt(this.value,10)||1))" style="width:56px" /></div>'
      + (sel.steps.length ? stepItems : '<div style="font-size:12.5px;opacity:.55;padding:6px 2px">No steps yet.</div>')
      + '</div>';

    var modelHeader = '<div class="row">'
      + '<input type="text" value="'+esc(sel.name)+'" placeholder="Model name" onchange="updateModelField(\''+sel.id+'\',\'name\',this.value)" style="flex:1;min-width:140px;font-weight:600" />'
      + '<input type="text" value="'+esc(sel.code||"")+'" placeholder="Code (optional)" onchange="updateModelField(\''+sel.id+'\',\'code\',this.value)" style="width:120px" />'
      + '<button class="btn btn-danger" onclick="removeModel(\''+sel.id+'\')">'+ICO.trash+' Delete model</button>'
      + '</div>';

    var selStep = sel.steps.find(function(s){ return s.id === state.modelsSelStepId; });
    var idx = sel.steps.findIndex(function(s){ return s.id === state.modelsSelStepId; });
    if (selStep){
      editorPane = '<div class="card" style="display:flex;flex-direction:column;gap:16px">'
        + modelHeader
        + '<div style="display:flex;flex-direction:column;gap:12px;max-width:420px">'
        + '<div><label class="field-label">Stage</label><br/><input type="text" value="'+esc(selStep.stage||"")+'" placeholder="e.g. Chassis Assembly" onchange="updateStepField(\''+selStep.id+'\',\'stage\',this.value)" style="width:100%;margin-top:4px" /></div>'
        + '<div><label class="field-label">Station</label><br/><input type="text" value="'+esc(selStep.station)+'" onchange="updateStepField(\''+selStep.id+'\',\'station\',this.value)" style="width:100%;margin-top:4px" /></div>'
        + '<div><label class="field-label">Step name</label><br/><input type="text" value="'+esc(selStep.name)+'" onchange="updateStepField(\''+selStep.id+'\',\'name\',this.value)" style="width:100%;margin-top:4px" /></div>'
        + '<div><label class="field-label">Target (s)</label><br/><input type="number" min="0" step="0.1" value="'+(selStep.target!=null?selStep.target:"")+'" onchange="updateStepField(\''+selStep.id+'\',\'target\',this.value)" style="width:140px;margin-top:4px" /></div>'
        + '<div><label class="field-label">Reps needed</label><br/><input type="number" min="1" step="1" value="'+(getStepReps(selStep, sel))+'" onchange="updateStepField(\''+selStep.id+'\',\'reps\',this.value)" style="width:140px;margin-top:4px" /></div>'
        + '<div class="row" style="margin-top:4px">'
        + '<button class="btn btn-outline" '+(idx===0?"disabled":"")+' onclick="moveStep('+idx+',-1)">'+ICO.up+' Move up</button>'
        + '<button class="btn btn-outline" '+(idx===sel.steps.length-1?"disabled":"")+' onclick="moveStep('+idx+',1)">'+ICO.down+' Move down</button>'
        + '<button class="btn btn-danger" onclick="removeStep(\''+selStep.id+'\')">'+ICO.trash+' Delete step</button>'
        + '</div></div></div>';
    } else {
      editorPane = '<div class="card" style="display:flex;flex-direction:column;gap:16px">' + modelHeader
        + '<div style="font-size:12.5px;opacity:.6">Add a step to get started, or import a CSV.</div></div>';
    }
  }

  return tools + '<div class="grid-models-3">'+modelsPane+stepsPane+editorPane+'</div>';
}

/* ---------------- Report tab ---------------- */
function renderReportTab(){
  var filtered = getFilteredRecords();
  var groupBy = state.reportGroupBy || "step";
  var stepStats = computeStepStats(filtered, groupBy);
  var cycleStats = computeCycleStats(filtered);

  var modelOptions = '<option value="all">All models</option>' + state.models.map(function(m){
    return '<option value="'+m.id+'" '+(state.reportFilterModel===m.id?"selected":"")+'>'+esc(m.name)+'</option>';
  }).join("");

  var filters = '<div class="card" style="margin-bottom:12px;padding:14px 16px;background:linear-gradient(180deg,#fbfaf6,#f4f1e8);border:1px solid var(--line)">'
    + '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">'
    + '<div style="font-size:18px">'+ICO.chart+'</div>'
    + '<div style="flex:1;min-width:240px"><div style="font-weight:700;font-size:14px">Cycle-time report</div>'
    + '<div style="font-size:11.5px;opacity:.65;margin-top:3px">Import/export uses the same wide Excel format: one row per step, with CT1, CT2, CT3… across the row, plus Date, Owner, Model, Stage and step details.</div></div>'
    + '<div style="display:flex;gap:7px;flex-wrap:wrap">'
    + '<button class="btn btn-outline" onclick="downloadReportTemplate()">'+ICO.dl+' Excel template</button>'
    + '<button class="btn btn-primary" onclick="downloadReportExcel()">'+ICO.dl+' Export Excel</button>'
    + '</div></div></div>'
    + '<div class="card row filters">'
    + '<select onchange="setReportFilterModel(this.value)">'+modelOptions+'</select>'
    + '<label class="field-label">Group by</label>'
    + '<select onchange="setReportGroupBy(this.value)">'
    + '<option value="step" '+(groupBy==="step"?"selected":"")+'>Step</option>'
    + '<option value="station" '+(groupBy==="station"?"selected":"")+'>Station</option>'
    + '<option value="stage" '+(groupBy==="stage"?"selected":"")+'>Stage</option>'
    + '</select>'
    + '<input type="date" value="'+state.reportDateFrom+'" onchange="setReportDateFrom(this.value)" />'
    + '<span style="font-size:12px;opacity:.5">to</span>'
    + '<input type="date" value="'+state.reportDateTo+'" onchange="setReportDateTo(this.value)" />'
    + '<div style="flex:1"></div>'
    + '<button class="btn btn-outline" onclick="triggerImportRecords()">'+ICO.ul+' Import Excel</button>'
    + '<button class="btn btn-outline" onclick="exportLocalBackup()">'+ICO.dl+' Backup</button>'
    + '<button class="btn btn-outline" onclick="triggerImportBackup()">'+ICO.ul+' Restore</button>'
    + '<button class="btn btn-outline" onclick="exportRecordsCSV()">'+ICO.dl+' Raw Data</button>'
    + '</div>';

  if (!filtered.length){
    return filters + '<div class="card" style="text-align:center;font-size:13px;opacity:.55;margin-top:14px">No readings match these filters yet.</div>';
  }

  var chartData = stepStats.map(function(s){
    var label = groupBy === "stage" ? (s.stage || "(no stage)")
      : groupBy === "station" ? s.station
      : (s.station + (s.stepName ? (" · "+s.stepName) : ""));
    return { label: label, avg: s.avg, sd: s.sd, target: s.target||0 };
  });
  var overallAvg = mean(stepStats.map(function(s){ return s.avg; })) || 0;
  var groupNoun = groupBy === "stage" ? "stage" : groupBy === "station" ? "station" : "step";
  var barMaxChart = chartData.length
    ? ('<div class="card" style="margin-top:14px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Average cycle time (SD) by '+groupNoun+'</div>'+buildBarSDChartSVG(chartData, overallAvg)+'</div>')
    : "";

  var selectedModel = (state.reportFilterModel !== "all") ? state.models.find(function(m){ return m.id === state.reportFilterModel; }) : null;
  var dailyComparison = selectedModel ? buildDailyComparisonCard(selectedModel, filtered) : '<div class="card" style="margin-top:14px;font-size:12.5px;opacity:.6">Pick a specific model above to compare its CT across multiple days.</div>';
  var fluctChart = selectedModel
    ? ('<div class="card" style="margin-top:14px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Fluctuation across readings — '+esc(selectedModel.name)+'</div>'+buildFluctuationSVG(selectedModel, filtered)+'</div>')
    : '<div class="card" style="margin-top:14px;font-size:12.5px;opacity:.6">Pick a specific model above to see the reading-by-reading fluctuation chart.</div>';

  var donutData = selectedModel ? computeGroupTotals(selectedModel, filtered, "stage") : {};
  var donutKeys = Object.keys(donutData);
  var donutIsStage = !(donutKeys.length <= 1 && donutKeys[0] === "(no stage)");
  if (selectedModel && !donutIsStage) donutData = computeGroupTotals(selectedModel, filtered, "station");
  var donutChart = selectedModel
    ? ('<div class="card" style="margin-top:14px"><div style="font-size:13px;font-weight:600;margin-bottom:10px">Contribution to total cycle time — '+esc(selectedModel.name)+' (by '+(donutIsStage?"stage":"station")+')</div>'+buildDonutSVG(donutData)+'</div>')
    : '<div class="card" style="margin-top:14px;font-size:12.5px;opacity:.6">Pick a specific model above to see each stage\'s % share of the total cycle time.</div>';

  var stepRows = stepStats.map(function(s){
    var over = s.target && s.avg > s.target;
    return '<tr><td>'+esc(s.modelName)+'</td><td>'+(s.stage?esc(s.stage):"<span style=\"opacity:.45\">—</span>")+'</td><td>'+(s.station?esc(s.station):"<span style=\"opacity:.45\">— combined —</span>")+'</td><td>'+(s.stepName?esc(s.stepName):"<span style=\"opacity:.45\">— all steps —</span>")+'</td>'
      + '<td class="num mono">'+(s.target?s.target.toFixed(1)+"s":"—")+'</td><td class="num mono">'+s.count+'</td>'
      + '<td class="num mono" style="font-weight:600;color:'+(over?"var(--red)":"var(--teal-dark)")+'">'+fmtSec(s.avg)+'</td>'
      + '<td class="num mono">'+(s.sd!==null?fmtSec(s.sd):"—")+'</td><td class="num mono">'+fmtSec(s.med)+'</td>'
      + '<td class="num mono">'+fmtSec(s.min)+'</td><td class="num mono">'+fmtSec(s.max)+'</td></tr>';
  }).join("");
  var stepTable = '<div class="card tbl-wrap" style="margin-top:14px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">'+(groupBy==="stage"?"Stage":groupBy==="station"?"Station":"Step")+' summary</div>'
    + '<table><thead><tr><th>Model</th><th>Stage</th><th>Station</th><th>Step</th><th>Target</th><th>Count</th><th>Avg</th><th>SD</th><th>Median</th><th>Min</th><th>Max</th></tr></thead>'
    + '<tbody>'+stepRows+'</tbody></table></div>';

  var cycleTable = "";
  if (cycleStats.length){
    var cRows = cycleStats.map(function(c){
      return '<tr><td>'+esc(c.modelName)+'</td><td class="num mono">'+c.count+'</td>'
        + '<td class="num mono" style="font-weight:600;color:var(--teal-dark)">'+fmtSec(c.avg)+'</td>'
        + '<td class="num mono">'+(c.sd!==null?fmtSec(c.sd):"—")+'</td><td class="num mono">'+fmtSec(c.min)+'</td><td class="num mono">'+fmtSec(c.max)+'</td></tr>';
    }).join("");
    cycleTable = '<div class="card tbl-wrap" style="margin-top:14px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Full-cycle summary (completed cycles only)</div>'
      + '<table><thead><tr><th>Model</th><th>Cycles</th><th>Avg total</th><th>SD</th><th>Min</th><th>Max</th></tr></thead>'
      + '<tbody>'+cRows+'</tbody></table></div>';
  }

  var rawRows = filtered.slice().sort(function(a,b){ return new Date(b.timestamp)-new Date(a.timestamp); }).slice(0,500).map(function(r){
    var over = r.target && r.duration > r.target;
    return '<tr><td class="mono" style="opacity:.7">'+new Date(r.timestamp).toLocaleString()+'</td><td>'+esc(r.modelName)+'</td><td>'+esc(r.station)+'</td><td>'+esc(r.stepName)+'</td>'
      + '<td class="num mono" style="font-weight:600;color:'+(over?"var(--red)":"var(--ink)")+'">'+fmtSec(recordCT(r))+'</td>'
      + '<td style="text-align:right"><button class="btn-danger" style="padding:3px" onclick="deleteRecord(\''+r.id+'\')">'+ICO.trash+'</button></td></tr>';
  }).join("");
  var rawTable = '<div class="card tbl-wrap" style="margin-top:14px;max-height:340px;overflow-y:auto"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Raw readings ('+filtered.length+(filtered.length>500?" - showing latest 500; use Raw Data export for all":"")+')</div>'
    + '<table><thead><tr><th>Time</th><th>Model</th><th>Station</th><th>Step</th><th class="num">Duration</th><th></th></tr></thead>'
    + '<tbody>'+rawRows+'</tbody></table></div>';

  return filters + barMaxChart + dailyComparison + fluctChart + donutChart + stepTable + cycleTable + rawTable;
}

/* ---------------------------------------------------------------------- */
/* Post-render wiring (things that can't be plain inline attributes)       */
/* ---------------------------------------------------------------------- */
function wireAfterRender(){
  if (state.tab === "timer"){
    if (anyTimerRunning()) startTick();
    else clearTick();
  } else {
    clearTick();
  }
}

window.addEventListener("beforeunload",function(){
  // Persist the timer exactly as-is. Do NOT pause it on navigation/window close.
  // The elapsed time is calculated from runningSince when the app returns.
  persistActiveState();
});
// IMPORTANT: Do not pause timers when the tab/window becomes hidden. Browsers
// throttle display callbacks in background tabs, but Date.now() still lets us
// calculate the true elapsed wall-clock time when the page becomes visible again.
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){
    if(anyTimerRunning()){ startTick(); }
    else { clearTick(); }
    renderTab();
  }
});
init();
})();
</script>
</body>
</html>
